<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mayra AI</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" id="tc" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mayra AI">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#fff;--sb:#fafafa;--bd:#ececec;--tx:#141414;--mut:#7a7a7a;--chip:#f4f4f4;--ink:#171717;--inkt:#fff;--card:#fff;--hl:#e8e8e8;--err:#c0392b;--code:#f6f6f7}
[data-theme=dark]{--bg:#161617;--sb:#1b1b1d;--bd:#2c2c2f;--tx:#ededed;--mut:#9a9a9f;--chip:#242427;--ink:#f2f2f2;--inkt:#111;--card:#1d1d20;--hl:#3a3a3e;--err:#ff7b6b;--code:#222225}
*{box-sizing:border-box;margin:0}
html,body{height:100%;height:100dvh}
body{font:14px/1.55 Inter,-apple-system,"Segoe UI",Roboto,"Noto Sans Bengali",sans-serif;background:var(--bg);color:var(--tx);display:flex;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:8px 10px;outline:0;width:100%}
input:focus,textarea:focus,select:focus{border-color:var(--mut)}
button:focus-visible{outline:2px solid var(--mut);outline-offset:2px}
svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* sidebar */
#sb{width:250px;background:var(--sb);border-right:1px solid var(--bd);display:flex;flex-direction:column;padding:14px 10px;gap:2px;transition:margin .2s;flex:none;z-index:30}
#sb.hide{margin-left:-250px}
.brand{display:flex;align-items:center;gap:8px;font-weight:650;font-size:15px;padding:2px 8px 12px}
.brand .sp{flex:1}
.nb{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;width:100%;text-align:left;color:var(--tx)}
.nb:hover,.nb.on{background:var(--chip)}
.lbl{font-size:12px;color:var(--mut);padding:14px 10px 4px;display:flex;align-items:center;gap:6px}
#hist{flex:1;overflow:auto;min-height:0}
.hi{display:flex;align-items:center;border-radius:9px;padding:0 4px 0 10px}
.hi:hover,.hi.on{background:var(--chip)}
.hi button.t{flex:1;text-align:left;padding:6px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;color:var(--mut)}
.hi.on button.t{color:var(--tx)}
.hi .d{opacity:0;padding:6px;color:var(--mut)}
.hi:hover .d{opacity:1}
#qs{display:none;margin:4px 0}
.user{display:flex;align-items:center;gap:10px;padding:10px;border-top:1px solid var(--bd);margin:6px -10px -14px;padding:12px 18px;width:calc(100% + 20px)}
.av{width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--inkt);display:grid;place-items:center;font-weight:600;font-size:12px;flex:none}
.user small{display:block;color:var(--mut);font-size:11px}
/* main */
main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative;height:100%}
#top{display:flex;align-items:center;padding:10px 14px;gap:8px;min-height:48px}
#top .sp{flex:1}
.ib{padding:7px;border-radius:9px;color:var(--mut)}
.ib:hover{background:var(--chip);color:var(--tx)}
#scroll{flex:1;overflow:auto;display:flex;flex-direction:column}
#home{margin:auto;width:100%;max-width:720px;padding:20px;display:flex;flex-direction:column;align-items:center}
#home h1{font-size:19px;font-weight:600;margin-top:14px}
#home p.s{color:var(--mut);font-size:13px;margin-bottom:26px}
#msgs{width:100%;max-width:760px;margin:0 auto;padding:10px 20px 20px;display:none;flex-direction:column;gap:20px}
.empty #home{display:flex}.empty #msgs{display:none}
.chatting #home{display:none}.chatting #msgs{display:flex}
.m{display:flex;gap:12px}
.m.u{justify-content:flex-end}
.m.u>div{max-width:85%;display:flex;flex-direction:column;align-items:flex-end}
.m.u .bd{background:var(--chip);padding:9px 14px;border-radius:16px;white-space:pre-wrap;overflow-wrap:break-word}
.m.a .lg{margin-top:3px}
.m.a .bd{flex:1;min-width:0;overflow-wrap:anywhere}
.bd p{margin:0 0 10px}.bd p:last-child{margin:0}
.bd ul,.bd ol{margin:0 0 10px 22px}
.bd h2,.bd h3,.bd h4{margin:14px 0 6px;font-size:15px}
.bd a{color:inherit;text-decoration:underline}
.bd code{background:var(--code);padding:1px 5px;border-radius:5px;font:12.5px ui-monospace,Menlo,Consolas,monospace}
.code{border:1px solid var(--bd);border-radius:12px;margin:8px 0 12px;overflow:hidden;background:var(--code)}
.ch{display:flex;justify-content:space-between;padding:6px 12px;font-size:12px;color:var(--mut);border-bottom:1px solid var(--bd)}
.code pre{padding:12px;overflow:auto}
.code code{background:none;padding:0;white-space:pre}
.bd img.g{max-width:min(100%,420px);border-radius:14px;display:block;margin:4px 0;border:1px solid var(--bd)}
.ims{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px;justify-content:flex-end}
.ims img{height:70px;border-radius:10px}
.err{color:var(--err)}
.acts{display:flex;gap:2px;margin-top:6px}
.dots span{display:inline-block;width:6px;height:6px;margin-right:4px;border-radius:50%;background:var(--mut);animation:b 1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes b{50%{opacity:.25}}
@media(prefers-reduced-motion:reduce){.dots span{animation:none}}
/* composer */
#cw{width:100%;max-width:760px;margin:0 auto;padding:0 20px 16px}
.empty #cw{max-width:720px;padding-bottom:0}
#comp{border:1px solid var(--bd);border-radius:18px;padding:12px 14px 10px;background:var(--bg);box-shadow:0 2px 14px rgba(0,0,0,.04)}
#comp:focus-within{border-color:var(--hl)}
#inp{border:0;padding:0;resize:none;max-height:320px;min-height:24px;border-radius:0;font-size:14px;line-height:1.55}
#prev{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
#prev div{position:relative}#prev img{height:56px;border-radius:9px;display:block}
#prev button{position:absolute;top:-6px;right:-6px;background:var(--ink);color:var(--inkt);border-radius:50%;width:18px;height:18px;font-size:11px;line-height:18px}
.cr{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:8px;position:relative}
.cr .sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;flex:none;border:1px solid var(--bd);border-radius:999px;padding:4px 11px;font-size:12px;background:var(--bg)}
.chip:hover{background:var(--chip)}
.chip.on{background:var(--ink);color:var(--inkt);border-color:var(--ink)}
#mb{min-width:0;font-size:12px;color:var(--mut);display:flex;align-items:center;gap:4px;padding:4px 8px;border-radius:8px;max-width:190px}
#mb:hover{background:var(--chip)}#mb span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#send,#vc{flex:none;width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--inkt);display:grid;place-items:center}
#send:disabled{opacity:.35;cursor:default}
#menu{position:absolute;right:0;bottom:calc(100% + 6px);width:290px;max-height:min(340px,50vh);overflow:auto;background:var(--card);border:1px solid var(--bd);border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.12);padding:6px;display:none;z-index:20}
#menu.open{display:block}
#menu h6{font-size:11px;color:var(--mut);padding:8px 10px 2px;font-weight:500}
#menu button{display:block;width:100%;text-align:left;padding:7px 10px;border-radius:8px;font-size:13px}
#menu button:hover,#menu button.on{background:var(--chip)}
#extra{width:100%;display:flex;flex-direction:column;gap:22px;margin-top:18px}
.empty #extra{display:flex}.chatting #extra{display:none}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.am{display:flex;justify-content:space-between;font-size:12px;font-weight:600}
.am span+span,.am button{color:var(--mut);font-weight:400}
.cards{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 8px;margin-top:8px;scroll-snap-type:x proximity}
.card{flex:0 0 172px;border:1px solid var(--bd);border-radius:12px;padding:12px;text-align:left;scroll-snap-align:start;background:var(--card)}
.card:hover{border-color:var(--hl)}
.card.on{border-color:var(--tx);box-shadow:0 0 0 1px var(--tx)}
.card b{display:block;font-size:12.5px;margin:2px 0 3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card small{display:block;color:var(--mut);font-size:11.5px;line-height:1.4;height:32px;overflow:hidden}
/* gallery / modal */
#gal{display:none;flex:1;overflow:auto;padding:10px 24px 30px}
#gal .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:12px}
#gal img{width:100%;border-radius:12px;border:1px solid var(--bd);display:block}
.galv #scroll,.galv #cw{display:none}.galv #gal{display:block}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:50;padding:14px}
#ov.open{display:flex}
#mod{background:var(--bg);border:1px solid var(--bd);border-radius:18px;width:100%;max-width:600px;max-height:88vh;overflow:auto;padding:20px}
#mod h2{font-size:17px;margin-bottom:4px;display:flex;justify-content:space-between;align-items:center}
#mod h3{font-size:12px;color:var(--mut);font-weight:500;margin:20px 0 8px}
.row{display:flex;gap:10px;align-items:center;margin-bottom:8px}.row>*{flex:1}.row label{flex:0 0 110px;color:var(--mut);font-size:13px}
details{border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin-bottom:8px}
summary{cursor:pointer;display:flex;align-items:center;gap:8px;font-weight:550;list-style:none}
summary::-webkit-details-marker{display:none}
summary i{font-style:normal;font-size:11px;color:var(--mut);font-weight:400;margin-left:auto}
summary i.ok{color:#2e9d57}
details .in{margin-top:10px;display:grid;gap:8px}
details a{color:var(--mut);font-size:12px}
.btn{border:1px solid var(--bd);border-radius:10px;padding:7px 14px}.btn:hover{background:var(--chip)}
.btn.p{background:var(--ink);color:var(--inkt);border-color:var(--ink)}
.tg{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.tg button{border:1px solid var(--bd);border-radius:12px;padding:12px;text-align:left}.tg button:hover{background:var(--chip)}
.tg small{display:block;color:var(--mut)}
#toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--inkt);padding:10px 18px;border-radius:14px;font-size:13px;line-height:1.5;text-align:center;width:max-content;display:none;z-index:99;max-width:min(92vw,420px);overflow-wrap:anywhere}
@media(max-width:800px){
#sb{position:fixed;top:0;bottom:0;left:0;box-shadow:4px 0 24px rgba(0,0,0,.15)}
.chatting #top,.empty #top{padding:8px}
#home{padding:12px}.row{flex-direction:column;align-items:stretch}.row label{flex:none}
.cr .sp{display:none}#mb{margin-left:auto;max-width:200px}.chip{padding:5px 10px}.tt{display:none}#cw{padding:0 12px 12px}.empty #cw{padding:0 12px}
}

/* live voice (Gemini Live) */
[hidden]{display:none!important}
.ir{display:flex;align-items:flex-end;gap:8px}
.ir #inp{flex:1;min-width:0;padding:5px 0 4px}
.rg{display:flex;align-items:center;gap:6px;flex:none}
.vinfo{font-size:12px;color:var(--mut);margin:0 0 8px}
#vo{--vbg:#dcdcd8;--vfg:#262626;--vmut:#7b7a76;--vc:#d3d2ce;--vbd:#c5c4bf;--vx:#2b2b2b;--vxt:#fff;position:fixed;left:0;right:0;top:0;height:100%;height:100dvh;z-index:60;background:var(--vbg);color:var(--vfg);display:none;flex-direction:column;padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));overflow:hidden;--lvl:0}
[data-theme=dark] #vo{--vbg:#1c1b1a;--vfg:#ece8e4;--vmut:#9a9690;--vc:#2b2927;--vbd:#3b3936;--vx:#ece8e4;--vxt:#1c1b1a}
#vo.open{display:flex}
.vtop{display:flex;align-items:center;gap:10px;position:relative;z-index:3}
.vsp{flex:1}
.vpill{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--vbd);background:var(--vc);color:var(--vmut);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:600}
#vDot{width:8px;height:8px;border-radius:50%;background:#aaa}
#vo[data-s=listen] #vDot{background:#34c26b}
#vo[data-s=speak] #vDot{background:#c47a5f}
#vo[data-s=connect] #vDot{background:#e0a030;animation:vdp 1s infinite}
@keyframes vdp{50%{opacity:.3}}
.vc{width:54px;height:54px;border-radius:50%;border:1px solid var(--vbd);background:var(--vc);display:grid;place-items:center;font-size:23px;flex:none;color:var(--vfg);line-height:1}
.vc svg{width:23px;height:23px}
.vc.on{background:var(--vx);color:var(--vxt)}
.vc.off{color:#d4503f}
.vc.vx{background:var(--vx);color:var(--vxt);width:64px;height:64px;border-color:var(--vx)}
.vc.vx svg{width:26px;height:26px}
.vstage{flex:1;min-height:0;display:grid;place-items:center;position:relative}
.orb{position:relative;width:min(80vw,330px);aspect-ratio:1;background:none;border:0;padding:0;cursor:pointer;display:block}
.orb .halo{position:absolute;inset:-26%;border-radius:50%;background:radial-gradient(circle,rgba(196,122,95,.17) 0%,rgba(196,122,95,.08) 42%,transparent 70%);transform:scale(calc(1 + var(--lvl)*.4))}
.orb .ring{position:absolute;inset:0;border-radius:50%;border:3px solid rgba(196,122,95,.28);transform:scale(calc(1 + var(--lvl)*.12))}
.orb .ball{position:absolute;inset:8.5%;border-radius:50%;background:linear-gradient(180deg,#c47a5f 0%,#d29a82 42%,#e2d3cc 72%,#e5e0dd 100%);box-shadow:0 24px 50px rgba(196,122,95,.22),inset 0 -18px 40px rgba(255,255,255,.35);transform:scale(calc(1 + var(--lvl)*.1))}
[data-theme=dark] .orb .ball{background:linear-gradient(180deg,#c47a5f 0%,#a8644d 45%,#6a504a 78%,#463b38 100%);box-shadow:0 24px 50px rgba(196,122,95,.18)}
#vo[data-s=listen] .orb{animation:vbr 4.2s ease-in-out infinite}
#vo[data-s=connect] .orb .ball{animation:vcn 1.2s ease-in-out infinite}
@keyframes vbr{50%{transform:scale(1.025)}}
@keyframes vcn{50%{opacity:.55}}
#vTx{min-height:104px;max-height:25vh;overflow:auto;text-align:center;font-size:18px;line-height:1.75;padding:6px 10px 18px;color:var(--vfg);overflow-wrap:anywhere}
#vTx[data-who=u]{color:var(--vmut)}
.vbar{display:flex;align-items:center;gap:10px}
.vin{flex:1;min-width:0;position:relative}
.vin input{border-radius:999px;height:56px;padding:0 54px 0 22px;background:var(--vc);border:1px solid var(--vbd);color:var(--vfg);font-size:16px}
.vin input::placeholder{color:var(--vmut)}
.vin input:focus{border-color:var(--vmut)}
#vSendT{position:absolute;right:6px;top:6px;width:44px;height:44px;border-radius:50%;background:var(--vx);color:var(--vxt);display:grid;place-items:center}
#vCam{position:absolute;top:calc(78px + env(safe-area-inset-top,0px));left:16px;width:104px;height:140px;border-radius:16px;overflow:hidden;border:2px solid var(--vbd);background:#000;z-index:3}
#vCam video{width:100%;height:100%;object-fit:cover}
#vCam.mir video{transform:scaleX(-1)}
#vFlip{position:absolute;right:4px;bottom:4px;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center}
#vFlip svg{width:15px;height:15px}
#vSheet{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;justify-content:flex-end}
#vSheet .scrim{position:absolute;inset:0;background:rgba(0,0,0,.32)}
#vSheet .sbody{position:relative;background:var(--bg);color:var(--tx);border-radius:22px 22px 0 0;max-height:74%;overflow:auto;padding:10px 18px calc(18px + env(safe-area-inset-bottom,0px))}
#vSheet .grab{width:38px;height:4px;border-radius:4px;background:var(--bd);margin:0 auto 10px}
#vSheet h4{font-size:16px;margin:2px 0 10px}
#vSheet label{display:block;font-size:12px;color:var(--mut);margin:12px 0 4px}
#vSheet .mut{color:var(--mut);font-size:12.5px;margin:10px 0}
.tl{margin:0 0 10px;padding:9px 13px;border-radius:14px;max-width:90%;overflow-wrap:anywhere;font-size:14px;line-height:1.65;white-space:pre-wrap}
.tl.u{background:var(--chip);margin-left:auto}
.tl.m{border:1px solid var(--bd)}
@media(prefers-reduced-motion:reduce){#vo .orb,#vo .ball,#vDot{animation:none!important}}
/* thinking box */
.think-box{border:1px solid var(--bd);border-radius:10px;margin:4px 0 10px;overflow:hidden;background:var(--code)}
.think-box>summary{padding:7px 12px;cursor:pointer;color:var(--mut);font-size:12px;font-weight:500;display:flex;align-items:center;gap:6px;list-style:none;user-select:none}
.think-box>summary::-webkit-details-marker{display:none}
.think-box>summary svg{width:13px;height:13px}
.think-box .tbc{padding:10px 12px;font-size:12px;color:var(--mut);white-space:pre-wrap;border-top:1px solid var(--bd);max-height:240px;overflow-y:auto;line-height:1.6;overflow-wrap:anywhere}

/* typing + streaming */
.typing{display:inline-flex;align-items:center;gap:10px;color:var(--mut);font-size:13px;padding:4px 0}
.typing .dt{display:inline-flex;gap:4px}
.typing .dt i{width:7px;height:7px;border-radius:50%;background:linear-gradient(135deg,var(--tx),var(--mut));opacity:.4;animation:wv 1.1s ease-in-out infinite}
.typing .dt i:nth-child(2){animation-delay:.14s}.typing .dt i:nth-child(3){animation-delay:.28s}
@keyframes wv{0%,60%,100%{transform:translateY(0) scale(.8);opacity:.35}30%{transform:translateY(-5px) scale(1);opacity:1}}
.shim{background:linear-gradient(90deg,var(--mut) 0%,var(--tx) 50%,var(--mut) 100%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 1.8s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.caret{display:inline-block;width:2px;height:1.05em;margin-left:2px;vertical-align:-.15em;background:var(--tx);border-radius:1px;animation:cb .9s steps(1) infinite}
@keyframes cb{50%{opacity:0}}
.m.a.live .lg svg{animation:lp 1.4s ease-in-out infinite}
@keyframes lp{50%{transform:scale(1.18);opacity:.55}}
/* follow-up suggestions */
.sugg{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.sl{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--mut);margin-bottom:2px}
.sl svg{width:13px;height:13px}
.sugg button{align-self:flex-start;text-align:left;border:1px solid var(--bd);border-radius:14px;padding:7px 13px;font-size:13px;line-height:1.4;background:var(--bg);animation:up .38s cubic-bezier(.2,.8,.2,1) both;transition:background .15s,border-color .15s}
.sugg button:nth-of-type(2){animation-delay:.07s}.sugg button:nth-of-type(3){animation-delay:.14s}
.sugg button:hover{background:var(--chip);border-color:var(--hl)}
@keyframes up{from{opacity:0;transform:translateY(8px)}}
/* app builder */
#bld{display:none;flex:1;min-height:0;flex-direction:column}
.appv #scroll,.appv #cw,.appv #gal{display:none}.appv #bld{display:flex}
.bh{display:flex;align-items:center;gap:8px;padding:2px 14px 10px}
.bh b{font-size:16px}.bh .sp{flex:1}
.bmod{font-size:12px;color:var(--mut);max-width:50%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bbody{flex:1;min-height:0;display:flex;gap:14px;padding:0 14px 14px}
.bl{width:330px;flex:none;overflow:auto;display:flex;flex-direction:column;gap:10px;padding-right:2px}
.bl textarea{resize:vertical}
.br{flex:1;min-width:0;display:flex;flex-direction:column;border:1px solid var(--bd);border-radius:16px;overflow:hidden;background:var(--card)}
.seg{display:flex;gap:4px;background:var(--chip);padding:3px;border-radius:11px}
.seg button{flex:1;padding:6px;border-radius:9px;font-size:13px}
.seg button.on{background:var(--bg);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.bw{width:100%;display:flex;justify-content:center;align-items:center;gap:6px}
.btabs{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.btabs .sp{flex:1}

<script>
/* Persistent storage: IndexedDB (big, durable) with a small localStorage copy as backup. The app starts after it is loaded. */
var KV=(function(){
 var mem={},db=null,ok=false;
 var ready=new Promise(function(res){
  var done=false;function fin(){if(!done){done=true;res()}}
  setTimeout(fin,4000);
  try{
   var rq=indexedDB.open('mayra',1);
   rq.onupgradeneeded=function(){rq.result.createObjectStore('kv')};
   rq.onerror=rq.onblocked=fin;
   rq.onsuccess=function(){
    db=rq.result;ok=true;
    try{
     var tx=db.transaction('kv','readonly'),st=tx.objectStore('kv'),ra=st.getAll(),rk=st.getAllKeys();
     tx.oncomplete=function(){
      rk.result.forEach(function(k,i){mem[k]=ra.result[i]});
      ['aivora_s','aivora_c','aivora_or','mayra_apps'].forEach(function(k){   /* first run / recovery: bring over old localStorage data */
       if(!(k in mem)){try{var v=localStorage.getItem(k);if(v!==null){mem[k]=v;put(k,v)}}catch(e){}}
      });
      fin();
     };
     tx.onerror=tx.onabort=function(){ok=false;fin()};
    }catch(e){ok=false;fin()}
   };
  }catch(e){fin()}
 });
 function put(k,v){try{var tx=db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.onerror=function(){}}catch(e){}}
 function get(k){if(k in mem)return mem[k];try{return localStorage.getItem(k)}catch(e){return null}}
 function set(k,v){
  mem[k]=v;var saved=false;
  if(ok&&db){try{put(k,v);saved=true}catch(e){}}
  try{if(v.length<150000)localStorage.setItem(k,v);else localStorage.removeItem(k);saved=true}catch(e){}
  return saved;
 }
 function del(k){delete mem[k];if(ok&&db){try{db.transaction('kv','readwrite').objectStore('kv').delete(k)}catch(e){}}try{localStorage.removeItem(k)}catch(e){}}
 return{ready:ready,get:get,set:set,del:del,isDB:function(){return ok}};
})();
KV.ready.then(function(){var el=document.createElement('script');el.textContent=document.getElementById('mainjs').textContent;document.body.appendChild(el)});
</script>

function md(src){
 const bl=[];
 src=src.replace(/```([\w+-]*)\n?([\s\S]*?)(```|$)/g,(m,l,c)=>{bl.push(`<div class="code"><div class="ch"><span>${esc(l||'code')}</span><button data-copy>Copy</button></div><pre><code>${esc(c.replace(/\n$/,''))}</code></pre></div>`);return`\u0000${bl.length-1}\u0000`});
 const inl=t=>t.replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<strong>$1</strong>').replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>').replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
 const out=[];let para=[],list=null;
 const fp=()=>{if(para.length)out.push('<p>'+para.join('<br>')+'</p>');para=[]},fl=()=>{if(list)out.push(`</${list}>`);list=null};
 for(const line of esc(src).split('\n')){let m;
  if(!line.trim()){fp();fl()}
  else if(m=line.match(/^(#{1,4})\s+(.*)/)){fp();fl();out.push(`<h${Math.min(m[1].length+1,4)}>${inl(m[2])}</h${Math.min(m[1].length+1,4)}>`)}
  else if(m=line.match(/^\s*[-*]\s+(.*)/)){fp();if(list!=='ul'){fl();out.push('<ul>');list='ul'}out.push(`<li>${inl(m[1])}</li>`)}
  else if(m=line.match(/^\s*\d+[.)]\s+(.*)/)){fp();if(list!=='ol'){fl();out.push('<ol>');list='ol'}out.push(`<li>${inl(m[1])}</li>`)}
  else if(/^\u0000\d+\u0000$/.test(line)){fp();fl();out.push(line)}
  else{fl();para.push(inl(line))}}
 fp();fl();
 return out.join('').replace(/\u0000(\d+)\u0000/g,(m,i)=>bl[i]);
}

async function readErr(r){let t=await r.text();try{const j=JSON.parse(t);t=j.error?.message||j.error||j.message||t;if(typeof t!=='string')t=JSON.stringify(t)}catch{}return`${P_name||'API'} error ${r.status}: ${String(t).slice(0,400)}`}
let P_name='';
async function sse(r,cb){const rd=r.body.getReader(),dc=new TextDecoder();let buf='';
 for(;;){const{done,value}=await rd.read();if(done)break;buf+=dc.decode(value,{stream:true});const ls=buf.split('\n');buf=ls.pop();
  for(const l of ls){const t=l.trim();if(t.startsWith('data:')){const d=t.slice(5).trim();if(d&&d!=='[DONE]'){try{cb(JSON.parse(d))}catch{}}}}}}
const b64=u=>u.split(',')[1],mime=u=>u.slice(5,u.indexOf(';'));
function history(c){return c.msgs.slice(0,-1).filter(m=>!m.err&&(m.role==='user'||m.content||m.gen)).map(m=>({role:m.role,content:m.content||(m.gen?'[generated an image]':''),images:m.images||[]}))}
async function chatStream(sel,c,am){
 const{p,m}=sel,pr=P[p],key=S.keys[p],h=history(c);P_name=pr.name;
 const temp=+S.temp;
 const identityP='তুমি '+(comp()?comp().name+' (Mayra AI-র companion)':'Mayra AI')+'। তোমাকে Rayhan sir বানাইছেন। কেউ যদি জিজ্ঞেস করে "তোমাকে কে বানিয়েছে", "তোমার মালিক কে", "তুমি কার AI", "তুমি কে" বা এ ধরনের যেকোনো পরিচয়-সম্পর্কিত প্রশ্ন করে — সবসময় উত্তর দেবে: "আমাকে Rayhan sir বানাইছে।"';
 const thinkP=thinkMode?'এই প্রশ্নের উত্তর দেওয়ার আগে ধাপে ধাপে গভীরভাবে চিন্তা করো। উত্তরটি সুন্দরভাবে সাজিয়ে, স্পষ্ট শিরোনাম ও বিভাগ ব্যবহার করে বিস্তারিতভাবে দাও।':'';
 const sysT=[(S.sys||'').trim(),compPrompt(),identityP,thinkP].filter(Boolean).join('\n\n');
 const add=t=>typeIn(am,t);
  if(pr.type==='oai'){
  const msgs=[];if(sysT)msgs.push({role:'system',content:sysT});
  h.forEach(x=>msgs.push({role:x.role,content:x.images.length?[{type:'text',text:x.content||' '},...x.images.map(u=>({type:'image_url',image_url:{url:u}}))]:x.content}));
  const r=await fetch(pr.base+'/chat/completions',{method:'POST',signal:ctrl.signal,headers:{'Content-Type':'application/json',Authorization:'Bearer '+key},body:JSON.stringify({model:m,messages:msgs,stream:true,temperature:temp})});
  if(!r.ok)throw new Error(await readErr(r));
  await sse(r,j=>{const d=j.choices?.[0]?.delta;if(d?.content)add(d.content)});
 }else if(pr.type==='anthropic'){
  const msgs=h.map(x=>({role:x.role,content:x.images.length?[...x.images.map(u=>({type:'image',source:{type:'base64',media_type:mime(u),data:b64(u)}})),{type:'text',text:x.content||' '}]:x.content}));
  const body={model:m,max_tokens:thinkMode?16000:4096,messages:msgs,stream:true};
  if(thinkMode){body.thinking={type:'enabled',budget_tokens:10000};body.temperature=1}else{body.temperature=Math.min(1,temp)}
  if(sysT)body.system=sysT;
  const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',signal:ctrl.signal,headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify(body)});
  if(!r.ok)throw new Error(await readErr(r));
  await sse(r,j=>{
   if(j.type==='content_block_delta'){
    if(j.delta?.type==='thinking_delta'&&j.delta.thinking){am.thinking=(am.thinking||'')+j.delta.thinking;paintLast()}
    else if(j.delta?.text)add(j.delta.text);
   }
   if(j.type==='error')throw new Error(j.error?.message);
  });
 }else{
  const contents=h.map(x=>({role:x.role==='user'?'user':'model',parts:[...x.images.map(u=>({inlineData:{mimeType:mime(u),data:b64(u)}})),{text:x.content||' '}]}));
  const body={contents,generationConfig:{temperature:Math.min(2,temp)}};if(sysT)body.systemInstruction={parts:[{text:sysT}]};
  const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(m)}:streamGenerateContent?alt=sse`,{method:'POST',signal:ctrl.signal,headers:{'Content-Type':'application/json','x-goog-api-key':key},body:JSON.stringify(body)});
  if(!r.ok)throw new Error(await readErr(r));
  await sse(r,j=>{(j.candidates?.[0]?.content?.parts||[]).forEach(x=>{if(x.text)add(x.text)})});
 }
 await typeDone(am);
 if(!am.content)am.content='(Empty response. Try another model.)';
}
function lastPhoto(c){
 if(!c)return'';let U=-1,G=-1;
 for(let i=c.msgs.length-1;i>=0&&i>=c.msgs.length-14;i--){const m=c.msgs[i];
  if(U<0&&m.role==='user'&&m.images&&m.images.length&&m.images[0].startsWith('data:'))U=i;
  if(G<0&&m.role==='assistant'&&m.gen&&m.gen.startsWith('data:'))G=i;}
 if(G>U&&!c.msgs[G].scratch)return c.msgs[G].gen;
 if(U>=0)return c.msgs[U].images[0];
 return G>=0?c.msgs[G].gen:'';
}

let orList=null;
async function orLoad(force){
 if(orList&&!force)return orList;
 if(!force){try{const c=JSON.parse(KV.get('aivora_or')||'null');if(c&&c.l&&c.l.length&&Date.now()-c.t<864e5){orList=c.l;return orList}}catch{}}
 const r=await fetch('https://openrouter.ai/api/v1/models');
 if(!r.ok)throw new Error('OpenRouter list error '+r.status);
 const j=await r.json();
 orList=(j.data||[]).map(m=>{const pr=m.pricing||{};return{id:m.id,name:m.name||m.id,ctx:m.context_length||0,free:/:free$/.test(m.id)||(+pr.prompt===0&&+pr.completion===0),vis:((m.architecture||{}).input_modalities||[]).includes('image'),pp:(+pr.prompt||0)*1e6}}).sort((a,b)=>a.name.localeCompare(b.name));
 try{KV.set('aivora_or',JSON.stringify({t:Date.now(),l:orList}))}catch{}
 return orList;
}

async function vMicStart(){
 vMicStream=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
 const tr=vMicStream.getAudioTracks()[0];
 if(tr)tr.onended=()=>{if(vLive)setTimeout(vMicRestart,300)};
 vMicSrc=vCtx.createMediaStreamSource(vMicStream);
 vAnIn=vCtx.createAnalyser();vAnIn.fftSize=512;vMicSrc.connect(vAnIn);
 if(!vSil){vSil=vCtx.createGain();vSil.gain.value=0;vSil.connect(vCtx.destination)}
 let ok=false;
 try{
  if(!vWlOK){
   const code='class P extends AudioWorkletProcessor{process(i){const c=i[0]&&i[0][0];if(c)this.port.postMessage(c.slice(0));return true}}registerProcessor("pcm-cap",P)';
   const url=URL.createObjectURL(new Blob([code],{type:'application/javascript'}));
   await vCtx.audioWorklet.addModule(url);URL.revokeObjectURL(url);vWlOK=true;
  }
  vMicNode=new AudioWorkletNode(vCtx,'pcm-cap');vMicNode.port.onmessage=e=>vMicData(e.data);ok=true;
 }catch{}
 if(!ok){vMicNode=vCtx.createScriptProcessor(2048,1,1);vMicNode.onaudioprocess=e=>vMicData(new Float32Array(e.inputBuffer.getChannelData(0)))}

/* ---------- generic LLM call (used by follow-ups, summary, app builder) ---------- */
async function llm(sel,sys,msgs,o={}){
 const{p,m}=sel,pr=P[p],key=S.keys[p];P_name=pr.name;let out='';
 const add=t=>{out+=t;if(o.onDelta)o.onDelta(out)};
 const temp=o.temp===undefined?.7:o.temp;
 if(pr.type==='oai'){
  const ms=(sys?[{role:'system',content:sys}]:[]).concat(msgs);
  const r=await fetch(pr.base+'/chat/completions',{method:'POST',signal:o.signal,headers:{'Content-Type':'application/json',Authorization:'Bearer '+key},body:JSON.stringify({model:m,messages:ms,stream:true,temperature:temp})});
  if(!r.ok)throw new Error(await readErr(r));
  await sse(r,j=>{const d=j.choices?.[0]?.delta;if(d?.content)add(d.content)});
 }else if(pr.type==='anthropic'){
  const body={model:m,max_tokens:o.max||4096,messages:msgs,stream:true,temperature:Math.min(1,temp)};if(sys)body.system=sys;
  const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',signal:o.signal,headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify(body)});
  if(!r.ok)throw new Error(await readErr(r));
  await sse(r,j=>{if(j.type==='content_block_delta'&&j.delta?.text)add(j.delta.text)});
 }else{
  const body={contents:msgs.map(x=>({role:x.role==='user'?'user':'model',parts:[{text:x.content||' '}]})),generationConfig:{temperature:Math.min(2,temp)}};
  if(sys)body.systemInstruction={parts:[{text:sys}]};
  const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(m)}:streamGenerateContent?alt=sse`,{method:'POST',signal:o.signal,headers:{'Content-Type':'application/json','x-goog-api-key':key},body:JSON.stringify(body)});
  if(!r.ok)throw new Error(await readErr(r));
  await sse(r,j=>{(j.candidates?.[0]?.content?.parts||[]).forEach(x=>{if(x.text&&!x.thought)add(x.text)})});
 }
 return out;
}

async function runTeam(task,c,am,sel){
 am.team=TEAM.map(r=>({k:r.k,e:r.e,n:r.n,text:'',st:'wait'}));
 const ctx=c.msgs.slice(0,-2).filter(m=>!m.err&&m.content).slice(-6).map(m=>`${m.role==='user'?'User':'Assistant'}: ${m.content.slice(0,600)}`).join('\n');
 const out={};
 const inp={
  planner:()=>`Task from the user:\n${task}${ctx?`\n\nRecent conversation:\n${ctx}`:''}`,
  coder:()=>`Task:\n${task}\n\nPlan from the Planner:\n${out.planner}`,
  designer:()=>`Task:\n${task}\n\nPlan:\n${out.planner}\n\nCoder result:\n${out.coder}`,
  reviewer:()=>`Task:\n${task}\n\nPlan:\n${out.planner}\n\nCurrent result (after the Designer):\n${out.designer}`
 };
 paintLast();
 for(let i=0;i<TEAM.length;i++){
  const r=TEAM[i],st=am.team[i];st.st='run';let raf=0;paintLast();
  try{
   const txt=await llm(sel,r.sys+TEAM_COMMON,[{role:'user',content:inp[r.k]()}],{signal:ctrl.signal,max:8000,temp:r.k==='planner'?.4:.5,onDelta:t=>{st.text=t;if(!raf)raf=requestAnimationFrame(()=>{raf=0;paintLast()})}});
   cancelAnimationFrame(raf);
   st.text=txt.trim();st.st='done';out[r.k]=st.text;
  }catch(e){cancelAnimationFrame(raf);st.st='err';throw e}
  paintLast();
 }
 am.content=out.reviewer;
}

function crc32(u8){let c,crc=-1;if(!crc32.t){crc32.t=[];for(let n=0;n<256;n++){c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;crc32.t[n]=c>>>0}}for(let i=0;i<u8.length;i++)crc=crc32.t[(crc^u8[i])&255]^(crc>>>8);return(crc^-1)>>>0}
function makeZip(files){
 const enc=new TextEncoder(),parts=[],cen=[];let off=0;
 const d=new Date(),dt=(((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate())&0xffff,tm=((d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1))&0xffff;
 files.forEach(f=>{
  const nm=enc.encode(f.name),data=enc.encode(f.data),crc=crc32(data);
  const lh=new DataView(new ArrayBuffer(30));
  lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(8,0,true);lh.setUint16(10,tm,true);lh.setUint16(12,dt,true);lh.setUint32(14,crc,true);lh.setUint32(18,data.length,true);lh.setUint32(22,data.length,true);lh.setUint16(26,nm.length,true);lh.setUint16(28,0,true);
  parts.push(lh.buffer,nm,data);
  const ch=new DataView(new ArrayBuffer(46));
  ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(10,0,true);ch.setUint16(12,tm,true);ch.setUint16(14,dt,true);ch.setUint32(16,crc,true);ch.setUint32(20,data.length,true);ch.setUint32(24,data.length,true);ch.setUint16(28,nm.length,true);ch.setUint32(42,off,true);
  cen.push(ch.buffer,nm);off+=30+nm.length+data.length;
 });
 const cl=cen.reduce((a,b)=>a+b.byteLength,0),e=new DataView(new ArrayBuffer(22));
 e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cl,true);e.setUint32(16,off,true);
 return new Blob([...parts,...cen,e.buffer],{type:'application/zip'});
}

 if(a==='avup'){const f=document.createElement('input');f.type='file';f.accept='image/*';f.onchange=async()=>{if(f.files[0]){const u=await sqImg(f.files[0],128);if(u){CP.img=u;compPaint()}}};f.click();return}
 if(a==='st'){CP.style=arg;compPaint();return}
 if(a==='compsave'){S.comp=Object.assign({},CP,{name:(CP.name||'').trim()||'Mayra'});saveS();closeModal();toast(S.comp.on===false?'Companion বন্ধ':`${S.comp.name} এখন তোমার সঙ্গী ✓`);return}
 if(a==='teamcopy'){const m=cur_&&cur_.msgs[+arg];if(m&&m.team)copyText(m.team.map(s=>`## ${s.e} ${s.n}\n${s.text}`).join('\n\n'));return}
 if(a==='tobuild'){
  const m=cur_&&cur_.msgs[+arg];if(!m)return;
  const mm=(m.content||'').match(/```html[ \t]*\n?([\s\S]*?)```/i);
  if(!mm){toast('HTML code পাওয়া যায়নি');return}
  B.type=B.type==='game'?'game':'web';B.id=null;B.html=mm[1].trim();B.vers=[];B.vi=-1;B.live='';
  const tm=B.html.match(/<title>([^<]{1,60})<\/title>/i);B.name=(tm&&tm[1].trim())||'AI Team result';B.prompt=(cur_.msgs[+arg-1]&&cur_.msgs[+arg-1].content)||'';
  $('#bP').value=B.prompt;$('#bE').value='';bPush('AI Team result');bSaveCur();openBuilder();bTab('prev');bRunFrame(true);return}
 if(a==='hver'){B.vi=+arg;bApplyVer();closeModal();return}
 if(a==='hcopy'){const v=B.vers[+arg];if(v)copyText(v.h);return}
 if(a==='exp'){doExport(arg);return}
 if(a==='qedit'){if(B.busy||!B.html)return;$('#bE').value=BQUICK[+arg];bBuild(true);return}
 if(a==='vcopy'){const all=[...vLog];if(vCurU.trim())all.push({role:'user',text:vCurU});if(vCurA.trim())all.push({role:'model',text:vCurA});copyText(all.map(x=>`${x.role==='user'?(S.name||'You'):(comp()?comp().name:'Mayra AI')}: ${x.text}`).join('\n\n'));return}
});

/* ---------- PWA ---------- */
let dip=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();dip=e;if(!matchMedia('(display-mode:standalone)').matches)$('#nInstall').hidden=false});
addEventListener('appinstalled',()=>{dip=null;$('#nInstall').hidden=true;toast('Installed')});
async function pwaInstall(){
 if(!dip){toast('Open your browser menu and tap “Add to Home screen”');return}
 dip.prompt();try{await dip.userChoice}catch{}dip=null;$('#nInstall').hidden=true;
}
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))(f=>document.readyState==='complete'?f():addEventListener('load',f))(()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})});

/* ---------- boot ---------- */
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist().catch(()=>{})}catch{}
applyTheme();initUI();
if(innerWidth<=800)$('#sb').classList.add('hide');
render();
if(!/^https?:$/.test(location.protocol))setTimeout(()=>toast('Opened from a file: the browser may forget your settings. Open it from a web address or use Backup settings.'),1200);
</script>
